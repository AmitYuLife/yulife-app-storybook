  ios-upload-bugsnag-mappings:
    steps:
    - script@1:
        title: Build bundle + upload
        inputs:
        - content: |
            #!/bin/bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            npm install --global @bugsnag/source-maps

            PACKAGE_VERSION=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[\",]//g' | tr -d '[[:space:]]')

            yarn react-native bundle \
                --platform ios \
                --dev false \
                --entry-file index.js \
                --bundle-output ios-release.bundle \
                --sourcemap-output ios-release.bundle.map

            ls ./

            bugsnag-source-maps upload-react-native \
              --api-key $BUGSNAG_API_KEY \
              --app-version $PACKAGE_VERSION \
              --platform ios \
              --bundle ios-release.bundle \
              --source-map ios-release.bundle.map \
              --overwrite
  run-mongodb:
    steps:
    - script@1.2:
        title: Install & Run MongoDB (mongodb-community@5.0)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            brew update
            brew tap mongodb/brew
            brew install mongodb-community@5.0
            brew tap homebrew/services

            # Add mongodb to PATH
            echo 'export PATH="/opt/homebrew/opt/mongodb-community@5.0/bin:$PATH"' >> ~/.zshrc

            # Set detox port for MongoDb
            echo "  port: 27018" >> /opt/homebrew/etc/mongod.conf

            # Start MongoDb
            brew services start mongodb/brew/mongodb-community@5.0

            echo 'MongoDb config...'
            cat /opt/homebrew/etc/mongod.conf
  run-postgres:
    steps:
    - script@1:
        title: Install & Run Postgres (postgresql@15)
        inputs:
        - content: |
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            brew update
            brew install postgresql@15 -v || true

            # Add postgres to PATH and create symlinks
            echo 'export PATH="/opt/homebrew/opt/postgresql@15/bin:$PATH"' >> ~/.zshrc
            ln -s /opt/homebrew/opt/postgresql@15/bin/psql /usr/local/bin/psql
            ln -s /opt/homebrew/opt/postgresql@15/bin/pg_ctl /usr/local/bin/pg_ctl
            ln -s /opt/homebrew/opt/postgresql@15/bin/createdb /usr/local/bin/createdb

            # Init postgres
            PGPORT=5432 PGHOST=localhost pg_ctl -D /opt/homebrew/var/postgresql@15 -l logfile start

            psql -d postgres -c "\du"
            psql -d postgres -U vagrant -h localhost -c "CREATE DATABASE yulife;"
            psql -d postgres -U vagrant -h localhost -c "CREATE USER yulife WITH PASSWORD 'yulife';"
            psql -d postgres -U vagrant -h localhost -c "ALTER USER yulife WITH SUPERUSER;"
  run-yulife-api-server:
    before_run:
    - run-postgres
    - run-mongodb
    envs:
    - NODE_ENV: detox
    steps:
    - restore-cache@1:
        inputs:
        - key: yarn-cache-silicon-{{ checksum "package-lock.json" "**/*.patch" }}
    - nvm@1:
        inputs:
        - node_version: 18.16.0
    - script@1.2:
        title: Pull & Run yulife-api-server (API)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e

            CWD=$(pwd)

            # Enable NVM command
            source $HOME/.profile

            mkdir -p ~/temp-repos
            cd ~/temp-repos

            git clone --depth 1 git@gitlab.com:yu-life/yulife-api-server.git api-clone
            mkdir -p yulife-api-server
            mv api-clone/{*,.[^.]*} yulife-api-server
            rm -rf api-clone

            cd yulife-api-server
            git checkout $BITRISE_GIT_BRANCH || git checkout develop
            git pull

            nvm use
            yarn install --frozen-lockfile
            ./scripts/setupPostgresForBitrise.sh
            yarn build

            yarn detox:changeRegionDatabase:${API_REGION:=UK}

            npm install -g forever
            env ${API_ENV_OVERWRITE:=NODE_ENV=detox} forever start -o ./api-stdout.txt -e ./api-stderr.txt build/app/index.js

            echo "Waiting for API ($API_REGION) to bootstrap..."
            npx wait-on http://localhost:${API_PORT:=5000}

            cd $CWD
    - save-cache@1:
        inputs:
        - paths: ~/temp-repos/yulife-api-server/node_modules
        - key: yarn-cache-{{ checksum "package-lock.json" "**/*.patch" }}
