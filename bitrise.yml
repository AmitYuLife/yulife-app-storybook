    before_run:
    - run-postgres
    - run-mongodb
    - run-valkey
    envs:
    - NODE_ENV: detox
    steps:
    - restore-cache@1:
        inputs:
        - key: yarn-cache-silicon-{{ checksum "package-lock.json" "**/*.patch" }}
    - nvm@1: {}
    - script@1.2:
        title: Pull & Run yulife-api-server (API)
        inputs:
        - script_file_path: null
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e

            CWD=$(pwd)

            # Enable NVM command
            source $HOME/.profile

            mkdir -p ~/temp-repos
            cd ~/temp-repos

            git clone git@gitlab.com:yu-life/yulife-api-server.git api-clone
            mkdir -p yulife-api-server
            mv api-clone/{*,.[^.]*} yulife-api-server
            rm -rf api-clone

            cd yulife-api-server
            git checkout "${API_BRANCH_NAME:-${BITRISE_GIT_BRANCH}}" || git checkout develop
            git pull

            nvm install
            echo "enabling corepack"
            corepack enable
            echo "running pnpm install"
            pnpm install --frozen-lockfile
            pnpm add node-gyp
            ./scripts/setupPostgresForBitrise.sh

            pnpm translations:download:local
            pnpm build
            pnpm detox:changeRegionDatabase:${API_REGION:=UK}

            npm install -g forever
            env ${API_ENV_OVERWRITE:=NODE_ENV=detox} DEBUG=yu:* forever start -o ./api-stdout.txt -e ./api-stderr.txt build/app/index.js

            echo "Waiting for API ($API_REGION) to bootstrap..."
            npx wait-on http://localhost:${API_PORT:=5000}

            cd $CWD
    - save-cache@1:
        inputs:
        - paths: ~/temp-repos/yulife-api-server/node_modules
        - key: yarn-cache-{{ checksum "package-lock.json" "**/*.patch" }}
    meta:
