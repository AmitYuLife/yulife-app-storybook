    - script@1:
        title: Build bundle + upload
        inputs:
        - script_file_path: null
        - content: |-
            #!/bin/bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            PACKAGE_VERSION=$(cat package.json | jq -r '.version')

            # Sourcemaps are created during the build process
            # Path to the sourcemap file is set to a tmp folder to avoid bundling it with the app
            # Remove trailing slash from TMPDIR variable
            TMPDIR="${TMPDIR%/}"
            SOURCEMAP_PATH=$TMPDIR/main.jsbundle.map
            BUNDLE_PATH=$BITRISE_APP_DIR_PATH/main.jsbundle

            echo " BITRISE APP DIR"
            ls $BITRISE_APP_DIR_PATH
            echo "TMP DIR"
            ls $TMPDIR

            npx bugsnag-eas-build-on-success
