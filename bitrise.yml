  bugsnag-build-reporter:
    before_run:
    - ios-git-checkout
    steps:
    - nvm@1: {}
    - script@1:
        title: Report build metadata to bugsnag
        inputs:
        - content: |-
            #!/bin/bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # Endpoint to fetch build details
            BUILD_DETAILS_URL="https://api.bitrise.io/v0.1/apps/${BITRISE_APP_SLUG}/builds/${BITRISE_BUILD_SLUG}"

            # Make the API call and extract the triggering user's details
            TRIGGERING_USER_JSON=$(curl -s -H "Authorization: token ${BITRISE_API_TOKEN}" ${BUILD_DETAILS_URL})
            TRIGGERING_USER_NAME=$(echo $TRIGGERING_USER_JSON | jq -r '.data.triggered_by')

            # Check if the API call was successful and the triggering user's name is available
            if [ -z "$TRIGGERING_USER_NAME" ] || [ "$TRIGGERING_USER_NAME" == "null" ]; then
              # If the API call failed or the triggering user's name isn't available, use the latest commit author's name or default to "Unknown Author"
              TRIGGERING_USER_NAME=${GIT_CLONE_COMMIT_COMMITER_NAME:-"Unknown Author"}
            fi

            echo "Build was triggered by: $TRIGGERING_USER_NAME for $BUGSNAG_RELEASE_ENVIRONMENT environment"

            PACKAGE_VERSION=$(cat package.json | jq -r '.version')

            npx bugsnag-build-reporter@2.0.0 \
              --api-key $BUGSNAG_API_KEY \
              --app-version $BUGSNAG_RELEASE_VERSION \
              --release-stage $BUGSNAG_RELEASE_ENVIRONMENT \
              --source-control-provider git \
              --source-control-repository https://gitlab.com/yu-life/yulife-rn-client/ \
              --source-control-revision $BITRISE_GIT_COMMIT \
              --builder-name $TRIGGERING_USER_NAME
  combine-overnight-detox-reports:
    steps:
    - activate-ssh-key@4.1:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8.0:
        inputs:
        - reset_repository: "Yes"
    - nvm@1: {}
    - script@1:
        inputs:
        - content: |
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            pip install --upgrade pip
            pip install --upgrade setuptools

            # install awscli
            brew install awscli

            ls e2e

            # Pull the last report if it exists
            npm i -g ts-node
            npm i -g allure-commandline
            ts-node  ./e2e/combineOvernightReports.ts
    - slack@3:
        is_always_run: false
        inputs:
        - api_token: ""
        - channel: qa-alerts
