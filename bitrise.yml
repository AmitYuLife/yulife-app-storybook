format_version: "3"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react_native
app:
  envs:
  - GRADLEW_PATH: android/gradlew
    opts:
      is_expand: false
  - GRADLE_BUILD_FILE_PATH: android/build.gradle
    opts:
      is_expand: false
  - GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
    opts:
      is_expand: false
  - BUNDLE_OUTPUT_FOLDER: release
    opts:
      is_expand: false
  - BITRISE_PROJECT_PATH: ios/YuLife.xcworkspace
    opts:
      is_expand: false
  - RELEASE_ENVIRONMENT: uat
  - XCODE_EXPORT_METHOD: development
  - APP_VERSION: 0.0.1
  - BUNDLE_ID: com.yulife.develop
  - BITRISE_SCHEME: YuLife
  - IPHONE_DEVICE: iPhone 11 Pro
    opts:
      is_expand: false
  - DETOX_TEST_TYPE: smoke
    opts:
      is_expand: false
  - DISPLAY_NAME: YuLife
    opts:
      is_expand: false
  - NODE_OPTIONS: --max-old-space-size=4096
  - SKIP_ASSERTIONS: ""
  - TARGET_LOCALE: en-GB
  - REPORT_S3_BUCKET_NAME: yu-eu-west-2-develop-detox-static-origin
    opts:
      is_expand: false
  - REPORT_DNS_NAME: detox.develop.uk.yulife.engineering
    opts:
      is_expand: false
meta:
  bitrise.io:
    machine_type: performance
    machine_type_id: g2-m1.4core
    stack: osx-xcode-13.0.x
trigger_map:
- push_branch: develop
  pipeline: pipeline-develop
- push_branch: release/*
  pipeline: pipeline-release-uat
- push_branch: release/**
  workflow: ios-detox-build-70
- push_branch: upgrade/*
  workflow: ios-develop
- tag: test-branch*
  pipeline: pipeline-test-branch
- tag: release*
  pipeline: pipeline-release-prod
- tag: android-release*
  workflow: android-production
pipelines:
  pipeline-develop:
    stages:
    - stage-develop: {}
  pipeline-release-prod:
    stages:
    - stage-release-prod: {}
  pipeline-release-uat:
    stages:
    - stage-release-uat: {}
  pipeline-test-branch:
    stages:
    - stage-test-branch: {}
stages:
  stage-develop:
    workflows:
    - ios-develop: {}
    - android-develop: {}
  stage-release-prod:
    workflows:
    - android-production: {}
    - ios-production: {}
  stage-release-uat:
    workflows:
    - ios-UAT: {}
    - android-UAT: {}
  stage-test-branch:
    workflows:
    - android-develop: {}
    - ios-develop: {}
workflows:
  android-UAT:
    before_run:
    - android-primary
    after_run:
    - android-upload-bugsnag-mappings
    envs:
    - RELEASE_ENVIRONMENT: uat
    - ENVFILE: .env.uat
    - BUNDLE_OUTPUT_FOLDER: uat
      opts:
        is_expand: false
    steps:
    - install-missing-android-tools: {}
    - gradle-runner@1:
        title: 'Gradle: clean'
        inputs:
        - gradle_task: clean
    - gradle-runner:
        title: 'Gradle: assembleUAT'
        inputs:
        - gradle_file: $GRADLE_BUILD_FILE_PATH
        - gradle_task: assembleUat -PsplitApks
        - gradlew_path: $GRADLEW_PATH
    - sign-apk@1:
        inputs:
        - use_apk_signer: "true"
        - apk_path: $BITRISE_APK_PATH_LIST
    - script@1.2:
        title: Remove unsigned apks
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            find $BITRISE_DEPLOY_DIR -name '*-unsigned.apk' -type f -size -100M -delete
            find $BITRISE_DEPLOY_DIR -name '*-aligned.apk' -type f -size -100M -delete
            cd $BITRISE_DEPLOY_DIR
            for f in *.apk; do mv "$f" "${f%.apk}-$BITRISE_BUILD_NUMBER.apk"; done
    - deploy-to-bitrise-io:
        inputs:
        - notify_email_list: test@yulife.com
        - public_install_page_url_map_format: '{{range $index, $element := .}}{{printf
            "%s|%s\n" $element.File $element.URL}}{{end}}'
        - notify_user_groups: admins, testers
    - slack@3.1.2:
        title: Build message
        is_always_run: false
        inputs:
        - channel: '#alerts-engineering'
        - from_username: UAT Build Succeeded
        - from_username_on_error: UAT Build Failed
        - emoji: ':android-icon:'
        - emoji_on_error: ':android-icon:'
        - icon_url: ""
        - pretext: Ready for regression test!
        - footer: yulife
        - footer_icon: https://join.yulife.com/static/favicon.png
        - fields: |
            Branch|${BITRISE_GIT_BRANCH}
            Workflow|${BITRISE_TRIGGERED_WORKFLOW_ID}
        - channel_on_error: '#engineering-alerts'
        - icon_url_on_error: ""
        - pretext_on_error: ""
        - buttons: |-
            View Build|${BITRISE_BUILD_URL}
            ${BITRISE_PUBLIC_INSTALL_PAGE_URL_MAP}
        - webhook_url: $SLACK_WEBHOOK_URL
  android-develop:
    before_run:
    - android-primary
    after_run:
    - android-upload-bugsnag-mappings
    envs:
    - RELEASE_ENVIRONMENT: develop
    - ENVFILE: .env.develop
    - BUNDLE_OUTPUT_FOLDER: release
      opts:
        is_expand: false
    steps:
    - install-missing-android-tools: {}
    - gradle-runner:
        inputs:
        - gradle_file: $GRADLE_BUILD_FILE_PATH
        - gradle_task: app:assembleRelease -PsplitApks
        - gradlew_path: $GRADLEW_PATH
    - sign-apk@1:
        inputs:
        - use_apk_signer: "true"
        - apk_path: $BITRISE_APK_PATH_LIST
    - script@1.2:
        title: Remove unsigned apks
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            echo $BITRISE_DEPLOY_DIR
            ls $BITRISE_DEPLOY_DIR
            find $BITRISE_DEPLOY_DIR -name '*-unsigned.apk' -type f -size -200M -delete
            find $BITRISE_DEPLOY_DIR -name '*-aligned.apk' -type f -size -200M -delete
            cd $BITRISE_DEPLOY_DIR
            for f in *.apk; do mv "$f" "${f%.apk}-$BITRISE_BUILD_NUMBER.apk"; done
    - deploy-to-bitrise-io:
        inputs:
        - notify_email_list: test@yulife.com
        - public_install_page_url_map_format: '{{range $index, $element := .}}{{printf
            "%s|%s\n" $element.File $element.URL}}{{end}}'
        - notify_user_groups: admins, testers
    - slack@3.5:
        title: Build message
        inputs:
        - channel: '#alerts-engineering'
        - emoji: ':android-icon:'
        - from_username: Build Succeeded
        - pretext: ""
        - footer: yulife
        - footer_icon: https://join.yulife.com/static/favicon.png
        - fields: |
            Branch|${BITRISE_GIT_BRANCH}
            Workflow|${BITRISE_TRIGGERED_WORKFLOW_ID}
            Build|${BITRISE_BUILD_NUMBER}
        - channel_on_error: '#engineering-alerts'
        - emoji_on_error: ':android-icon:'
        - icon_url_on_error: ""
        - from_username_on_error: Build Failed
        - pretext_on_error: ""
        - buttons: |
            ${BITRISE_PUBLIC_INSTALL_PAGE_URL_MAP}
        - webhook_url: $SLACK_WEBHOOK_URL
    meta:
      bitrise.io:
        machine_type: performance
  android-primary:
    steps:
    - activate-ssh-key@4.1:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone:
        inputs:
        - reset_repository: "Yes"
    - script@1:
        inputs:
        - content: node -v
    - nvm@1:
        inputs:
        - node_version: 16.19.0
        - nvm_version: 0.38.0
    - script@1:
        title: Magic
        inputs:
        - content: |-
            # TODO: Is Magic needed?
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p
            # Cris Magic goes here
            mkdir /usr/local/share/android-sdk/cmdline-tools/latest/
            mkdir /usr/local/share/android-sdk/cmdline-tools/latest/bin/
            ln -s /usr/local/share/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager /usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager
            /usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
    - script@1:
        title: yarn
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            yarn install --frozen-lockfile
    - script@1.2:
        title: yarn translations:download
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            set -x
            yarn translations:download
    - install-react-native@0.10:
        inputs:
        - version: 9.3.2
    - script@1:
        title: yarn build
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            yarn tsc
    - codecov@3.2:
        is_always_run: true
        inputs:
        - OS: macos
        - CODECOV_TOKEN: $CODECOV_TOKEN
    - script@1.2:
        title: Set version code
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # write your script here
            node ./scripts/replace-package-versionCodes.js $BITRISE_BUILD_NUMBER
  android-production:
    before_run:
    - android-primary
    after_run:
    - android-upload-bugsnag-mappings
    envs:
    - RELEASE_ENVIRONMENT: production
    - BUNDLE_ID: com.yulife.app
      opts:
        is_expand: false
    - ENVFILE: .env.production
      opts:
        is_expand: false
    - BUNDLE_OUTPUT_FOLDER: production
      opts:
        is_expand: false
    steps:
    - install-missing-android-tools: {}
    - gradle-runner:
        title: assembleProduction
        inputs:
        - gradle_file: $GRADLE_BUILD_FILE_PATH
        - gradlew_path: $GRADLEW_PATH
        - gradle_task: assembleProduction -PsplitApks
    - sign-apk@1:
        inputs:
        - use_apk_signer: "true"
        - apk_path: $BITRISE_APK_PATH_LIST
    - deploy-to-bitrise-io: {}
    - google-play-deploy@3.7:
        inputs:
        - package_name: $BUNDLE_ID
        - track: pre-internal
        - apk_path: $BITRISE_SIGNED_APK_PATH
        - service_account_json_key_path: $BITRISEIO_SERVICE_ACCOUNT_KEY_URL
    - slack@2.7.2:
        inputs:
        - webhook_url: https://hooks.slack.com/services/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
        - text: Successfully deployed to the play store
        - emoji: ':android-icon:'
        - icon_url: ""
        - channel: '#alerts-engineering'
  android-upload-bugsnag-mappings:
    steps:
    - script@1:
        title: Upload to bugsnag
        inputs:
        - content: |-
            #!/bin/bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            ls ./android/app/build/generated/assets/react/$BUNDLE_OUTPUT_FOLDER
            ls ./android/app/build/generated/sourcemaps/react/$BUNDLE_OUTPUT_FOLDER
            ls ./android/app/build/intermediates/sourcemaps/react/$BUNDLE_OUTPUT_FOLDER

            npm install --global @bugsnag/source-maps

            PACKAGE_VERSION=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[\",]//g' | tr -d '[[:space:]]')
            VERSION_CODE=$(cat package.json | grep versionCode | head -1 | awk -F: '{ print $2 }' | sed 's/[\",]//g' | tr -d '[[:space:]]')

            echo $PACKAGE_VERSION
            echo $VERSION_CODE

            bugsnag-source-maps upload-react-native \
              --api-key $BUGSNAG_API_KEY \
              --app-version $PACKAGE_VERSION \
              --platform android \
              --bundle android/app/build/generated/assets/react/$BUNDLE_OUTPUT_FOLDER/index.android.bundle \
              --source-map android/app/build/intermediates/sourcemaps/react/$BUNDLE_OUTPUT_FOLDER/index.android.bundle.packager.map \
              --overwrite
  ios-UAT:
    before_run:
    - ios-primary
    after_run:
    - ios-upload-bugsnag-mappings
    envs:
    - BITRISE_SCHEME: uat
    - ENVFILE: .env.uat
      opts:
        is_expand: false
    - DISPLAY_NAME: YuLife (UAT)
      opts:
        is_expand: false
    steps:
    - script@1:
        title: Set bitrise build number
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            node scripts/set-bitrise-build-number.js
    - xcode-archive@4.5:
        inputs:
        - team_id: 739BJV2T6V
        - force_team_id: 739BJV2T6V
        - export_all_dsyms: "no"
        - export_method: ad-hoc
        - configuration: Release
        - custom_export_options_plist_content: ""
        - distribution_method: app-store
        - automatic_code_signing: api-key
        - export_development_team: 739BJV2T6V
        - is_clean_build: "yes"
    - deploy-to-bitrise-io@1.3.9:
        inputs:
        - notify_user_groups: admins, testers
    - slack@3.1.3:
        title: Build message
        inputs:
        - from_username: UAT Build Succeeded
        - webhook_url: $SLACK_WEBHOOK_URL
        - channel: '#alerts-engineering'
        - from_username_on_error: UAT Build Failed
        - emoji: ':apple-icon:'
        - icon_url: ""
        - pretext: Ready for regression test!
        - footer: yulife
        - footer_icon: https://join.yulife.com/static/favicon.png
        - fields: |-
            Branch|${BITRISE_GIT_BRANCH}
            Workflow|${BITRISE_TRIGGERED_WORKFLOW_ID}
        - icon_url_on_error: ""
        - pretext_on_error: ""
        - channel_on_error: '#engineering-alerts'
        - emoji_on_error: ':apple-icon:'
    - deploy-to-itunesconnect-application-loader@1.4:
        inputs:
        - password: $ITUNES_CONNECT_PASSWORD
        - app_password: $ITUNES_PASSWORD_APP_SPECIFIC
        - itunescon_user: $BITRISE_PROVISION_URL
    meta:
      bitrise.io:
        stack: osx-xcode-14.2.x-ventura
  ios-detox-build-70:
    before_run:
    - ios-git-checkout
    steps:
    - nvm@1:
        inputs:
        - node_version: 16.19.0
        - nvm_version: 0.38.0
    - script@1:
        title: Install dependencies & build binary
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e

            # Install ruby version
            cd ios
            asdf install ruby $(cat .ruby-version)
            asdf global ruby $(cat .ruby-version)

            # Install node version
            brew uninstall --force yarn
            . $HOME/.nvm/nvm.sh
            cd ..
            nvm use
            npm i -g yarn
            yarn install --frozen-lockfile
    - restore-cocoapods-cache@1: {}
    - cocoapods-install@2: {}
    - save-cocoapods-cache@1: {}
    - script@1.2:
        title: yarn translations:download
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            set -x
            yarn translations:download
    - script@1:
        title: Build Detox
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            yarn detox:build -c ios.sim.release
    - cache-push@2:
        inputs:
        - is_debug_mode: "true"
        - cache_paths: |-
            $BITRISE_SOURCE_DIR/ios/build/Build/Products/Release-iphonesimulator/YuLife.app
            $BITRISE_SOURCE_DIR/node_modules
            $BITRISE_SOURCE_DIR/src/locale/translations/downloaded
    meta:
      bitrise.io:
        stack: osx-xcode-14.2.x-ventura
  ios-detox-run-all-overnight-70:
    before_run:
    - ios-detox-build-70
    steps:
    - build-router-start@0:
        title: 'Run smoke tests: iPhone 14 Pro'
        inputs:
        - workflows: ios-detox-run-iphone-14-pro-smoke-all-70
        - access_token: $BITRISE_API_TOKEN
    - build-router-start@0:
        title: 'Run extended tests: iPhone 14 Pro Extended'
        inputs:
        - workflows: ios-detox-run-iphone-14-pro-extended-all-70
        - access_token: $BITRISE_API_TOKEN
    - build-router-start@0:
        title: 'Run PLI tests: iPhone 14 Pro PLI'
        inputs:
        - workflows: ios-detox-run-iphone-14-pro-pli-1-70
        - access_token: $BITRISE_API_TOKEN
    - build-router-start@0:
        title: 'Run PLI tests: iPhone 14 Pro PLI 2'
        inputs:
        - workflows: ios-detox-run-iphone-14-pro-pli-2-70
        - access_token: $BITRISE_API_TOKEN
    - build-router-start@0:
        title: 'Run dental tests: iPhone 14 Pro Dental'
        inputs:
        - workflows: ios-detox-run-iphone-14-pro-dental-70
        - access_token: $BITRISE_API_TOKEN
    - build-router-start@0:
        title: 'Run detox tests: iPhone SE 3rd Gen Smoke'
        inputs:
        - workflows: ios-detox-run-iphone-se-smoke-all-70
        - access_token: $BITRISE_API_TOKEN
    - build-router-start@0:
        title: 'Run detox tests: iPhone 14 Pro USA'
        inputs:
        - workflows: ios-detox-run-iphone-14-pro-usa-70
        - access_token: $BITRISE_API_TOKEN
    - build-router-start@0:
        title: 'Run detox tests: iPhone 14 Pro SA'
        inputs:
        - workflows: ios-detox-run-iphone-14-pro-sa-70
        - access_token: $BITRISE_API_TOKEN
    meta:
      bitrise.io:
        stack: osx-xcode-14.2.x-ventura
  ios-detox-run-base-70:
    before_run:
    - ios-git-checkout
    - run-yulife-api-server
    envs:
    - API_ENV_OVERWRITE: NODE_ENV=detox DEBUG=yu:*
    - API_REGION: UK
    - API_PORT: "5000"
    steps:
    - cache-pull@2.7:
        title: Bitrise.io Cache:Pull - iOS build + node_modules
    - nvm@1:
        inputs:
        - node_version: 16.19.0
    - script@1:
        title: Run Detox Tests
        inputs:
        - content: |+
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e

            # Install dependencies
            brew tap wix/brew
            brew install wix/brew/applesimutils || true
            . $HOME/.nvm/nvm.sh
            nvm use
            npm i -g yarn || true
            yarn install --frozen-lockfile

            # Clean and re-build detox cache
            yarn detox clean-framework-cache && yarn detox build-framework-cache

            # Set detox test device
            node ./scripts/replace-detox-test-device.js "$IPHONE_DEVICE"

            # Run tests
            command="TARGET_LOCALE=$TARGET_LOCALE yarn detox:$DETOX_TEST_TYPE -c ios.sim.release --take-screenshots all --artifacts-location ./e2e-report --loglevel \"${DETOX_LOG_LEVEL:=warn}\" --debug-synchronization 200 --record-logs failing"

            # If SKIP_ASSERTIONS flag is set, prefix the command with its value
            [[ -n $SKIP_ASSERTIONS ]] && command="SKIP_ASSERTIONS=$SKIP_ASSERTIONS $command"

            # Evaluate command / Run
            eval $command
    - script@1:
        title: Collect logs
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            forever stop -o build/app/index.js
            node ./scripts/get-test-results.js | envman add --key E2E_RESULTS
            cp ~/temp-repos/yulife-api-server/api-stdout.txt ./e2e-report
            cp ~/temp-repos/yulife-api-server/api-stderr.txt ./e2e-report
    - deploy-to-bitrise-io@2.2:
        inputs:
        - deploy_path: $BITRISE_SOURCE_DIR/e2e-report
        - is_compress: "true"
        - zip_name: test-results
        - debug_mode: "true"
        - notify_user_groups: none
    - script@1:
        title: Publish gallery and report to s3 site
        is_always_run: true
        inputs:
        - content: |
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            cd "$BITRISE_SOURCE_DIR/e2e-report"
            ls

            # make a copy in screenshots for report upload
            FOLDER_NAME=$(ls -t | grep 'ios.')
            cp -R "$FOLDER_NAME" screenshots

            # flatten the directory using ios.sim.debug folder
            npm install --global @hutsoninc/flatten-dir-cli
            flatten "$FOLDER_NAME"
            find "$FOLDER_NAME" -type f -name 'testDone*.png' -delete || true

            # make the gallery site
            brew install exiftool graphicsmagick
            npm i -g thumbsup
            thumbsup --input "$FOLDER_NAME" --output ./gallery --title "$IPHONE_DEVICE: generated from $DETOX_TEST_TYPE test on $(date)" --thumb-size 250 --theme flow | tee thumbsup.txt

            # sync the gallery
            brew install awscli
            cd gallery

            # Temp set AWS Access Key Env Vars
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID2
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY2

            # set path for s3
            if [ "$TARGET_LOCALE" = "en-GB" ]; then
                S3_PATH="$DETOX_TEST_TYPE/$IPHONE_DEVICE"
            else
                S3_PATH="$TARGET_LOCALE/$DETOX_TEST_TYPE/$IPHONE_DEVICE"
            fi

            # upload to s3
            aws s3 sync . "s3://$REPORT_S3_BUCKET_NAME/screenshots/$S3_PATH" --no-progress

            # invalidate CF distribution
            CLOUDFRONT_DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[*].{id:Id,origin:Origins.Items[0].Id}[?origin=='$REPORT_S3_BUCKET_NAME'].id" --output text)
            aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"

            # remove bulk from the report upload, keep screenshots only
            cd ..
            rm -rf gallery
            rm -rf "$FOLDER_NAME"


            # Sync the mochawesome report
            aws s3 sync . "s3://$REPORT_S3_BUCKET_NAME/reports/$BITRISE_BUILD_NUMBER" --no-progress

            envman add --key MOCHAWESOME_REPORT --value "https://$REPORT_DNS_NAME/reports/$BITRISE_BUILD_NUMBER/mochawesome.html"
            envman add --key SCREENSHOTS_REPORT --value $(echo "https://$REPORT_DNS_NAME/screenshots/$S3_PATH/index.html" | sed -e 's/ /%20/g')
    - slack@3:
        inputs:
        - api_token: ""
        - channel: alerts-e2e-results
        - text: ""
        - from_username: Detox
        - pretext: '*All tests passed!* :party:'
        - fields: |-
            Branch|${BITRISE_GIT_BRANCH}
            Results|$E2E_RESULTS
            Device|$IPHONE_DEVICE
