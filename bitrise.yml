  ios-detox-run-base-70:
    before_run:
    - ios-git-checkout
    - run-yulife-api-server
    envs:
    - API_ENV_OVERWRITE: NODE_ENV=detox
    - API_REGION: UK
    - API_PORT: "5000"
    steps:
    - restore-cache@2:
        inputs:
        - key: ios-detox-build-$BITRISE_GIT_BRANCH
    - nvm@1: {}
    - script@1:
        title: Install S3 CLI and pull last allure report if it exists
        is_always_run: true
        inputs:
        - content: |
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            pip install --upgrade pip
            pip install --upgrade setuptools

            mkdir "$BITRISE_SOURCE_DIR/e2e-report"
            mkdir "$BITRISE_SOURCE_DIR/e2e-report/allure-report"
            mkdir "$BITRISE_SOURCE_DIR/e2e-report/allure-report/history"

            cd "$BITRISE_SOURCE_DIR/e2e-report/allure-report/history"

            # install awscli
            brew install awscli

            # Pull the last report if it exists
            aws s3 sync "s3://$REPORT_S3_BUCKET_NAME/reports/$DETOX_TEST_TYPE/develop/allure-report/history" . --no-progress || echo "No history folder in remote found"
    - script@1:
        title: Run Detox Tests
        inputs:
        - script_file_path: null
        - content: |
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e

            # Install dependencies
            brew tap wix/brew
            brew update
            # Install coreutils to add timeout command
            brew install wix/brew/applesimutils coreutils || true
            . $HOME/.nvm/nvm.sh
            nvm use
            npm i -g yarn || true
            corepack enable
            yarn install --immutable

            # Clean and re-build detox cache
            yarn detox clean-framework-cache && yarn detox build-framework-cache

            # Set detox test device
            node ./scripts/replace-detox-test-device.js "$IPHONE_DEVICE"

            # Build the translation mapping
            yarn detox:build:translations

            # Run tests
            command="TARGET_LOCALE=$TARGET_LOCALE yarn detox:run $DETOX_TEST_TYPE -c ios.sim.release --take-screenshots all --artifacts-location ./e2e-report --loglevel \"${DETOX_LOG_LEVEL:=warn}\" --debug-synchronization 200 --record-logs all --record-videos failing"

            # If SKIP_ASSERTIONS flag is set, prefix the command with its value
            [[ -n $SKIP_ASSERTIONS ]] && command="SKIP_ASSERTIONS=$SKIP_ASSERTIONS $command"

            # Evaluate command / Run
            # Timeout after 70m; Max job timeout is 90m, allow 15m for setup and 5m to send reports after tests timeout
            timeout --preserve-status --foreground 70m zsh -c "$command"
    - script@1:
        title: Collect logs
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            npm install -g forever
            forever stop -o build/app/index.js
            node ./scripts/get-test-results.js | envman add --key E2E_RESULTS
            cp ~/temp-repos/yulife-api-server/api-stdout.txt ./e2e-report
            cp ~/temp-repos/yulife-api-server/api-stderr.txt ./e2e-report
    - deploy-to-bitrise-io:
        inputs:
        - deploy_path: $BITRISE_SOURCE_DIR/e2e-report
        - is_compress: "true"
        - zip_name: test-results
        - debug_mode: "true"
        - notify_user_groups: none
    - script@1:
        title: Publish gallery and report to s3 site
        is_always_run: true
        inputs:
        - content: |
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            cd "$BITRISE_SOURCE_DIR/e2e-report"
            ls

            # make a copy in screenshots for report upload
            FOLDER_NAME=$(ls -t | grep 'ios.')
            cp -R "$FOLDER_NAME" screenshots

            # flatten the directory using ios.sim.release folder
            npm install --global @hutsoninc/flatten-dir-cli
            flatten "$FOLDER_NAME"
            find "$FOLDER_NAME" -type f -name 'testDone*.png' -delete || true

            # make the gallery site
            brew install exiftool graphicsmagick
            npm i -g thumbsup
            thumbsup --input "$FOLDER_NAME" --output ./gallery --title "$IPHONE_DEVICE: generated from $DETOX_TEST_TYPE test on $(date)" --thumb-size 250 --theme flow | tee thumbsup.txt

            # sync the gallery
            cd gallery

            # set path for s3
            DATE=$(date +'%d-%m-%Y')
            DEVICE_NAME="${IPHONE_DEVICE// /-}"

            if [ "$TARGET_LOCALE" = "en-GB" ]; then
                S3_PATH="$DETOX_TEST_TYPE/$DATE/$DEVICE_NAME"
            else
                S3_PATH="$TARGET_LOCALE/$DETOX_TEST_TYPE/$DATE/$DEVICE_NAME"
            fi

            # upload to s3
            aws s3 sync . "s3://$REPORT_S3_BUCKET_NAME/screenshots/$S3_PATH" --no-progress

            # invalidate CF distribution
            CLOUDFRONT_DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[*].{id:Id,origin:Origins.Items[0].Id}[?origin=='$REPORT_S3_BUCKET_NAME'].id" --output text)
            aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"

            # remove bulk from the report upload, keep screenshots only
            cd ..
            rm -rf gallery
            rm -rf "$FOLDER_NAME"


            # Sync the jest report
            aws s3 sync . "s3://$REPORT_S3_BUCKET_NAME/reports/$DETOX_TEST_TYPE/$BITRISE_BUILD_NUMBER" --no-progress

            # If current brnach is develop (TODO) sync the current folder to "develop"
            if [ "$BITRISE_GIT_BRANCH" = "develop" ]; then
              aws s3 sync . "s3://$REPORT_S3_BUCKET_NAME/reports/$DETOX_TEST_TYPE/develop" --no-progress --delete
            fi

            envman add --key JEST_REPORT --value "https://$REPORT_DNS_NAME/reports/$DETOX_TEST_TYPE/$BITRISE_BUILD_NUMBER/jest_html_reporters.html"
            envman add --key ALLURE_REPORT --value "https://$REPORT_DNS_NAME/reports/$DETOX_TEST_TYPE/$BITRISE_BUILD_NUMBER/allure-report/index.html"
            envman add --key SCREENSHOTS_REPORT --value $(echo "https://$REPORT_DNS_NAME/screenshots/$S3_PATH/index.html" | sed -e 's/ /%20/g')
    - slack@3:
        inputs:
        - api_token: ""
        - channel: alerts-e2e-results
        - text: ""
        - from_username: Detox
        - pretext: '*All tests passed!* :party:'
        - fields: |-
            Branch|${BITRISE_GIT_BRANCH}
            Results|$E2E_RESULTS
            Device|$IPHONE_DEVICE
            Test Type|$DETOX_TEST_TYPE
            Locale|$TARGET_LOCALE
        - buttons: |-
            View Results|${ALLURE_REPORT}
            View Job|${BITRISE_BUILD_URL}
            Download Results|${BITRISE_BUILD_URL}#?tab=artifacts
            Screenshots|${SCREENSHOTS_REPORT}
        - from_username_on_error: Detox
        - pretext_on_error: '*Detox tests failed!* :cry:'
        - is_debug_mode: "yes"
        - webhook_url: $SLACK_WEBHOOK_URL
    meta:
      bitrise.io:
        stack: osx-xcode-16.2.x
