  ios-run-api-local:
    steps:
    - nvm@1:
        inputs:
        - node_version: 14.18.1
    - script@1:
        title: Install & run Postgres
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x
            id -un

            brew services list
            brew uninstall --force postgresql || echo "postgres not installed"
            rm -rf /usr/local/var/postgres || echo "postgres dir doesn't exist"
            brew install postgresql -v || true
            #brew doctor
            #brew services list
            ls /usr/local/var/postgres || initdb -D /usr/local/var/postgres || echo "Already inited"
            #PGPORT=5432 PGHOST=localhost brew services start postgresql
            PGPORT=5432 PGHOST=localhost pg_ctl -D /usr/local/var/postgres -l logfile start
            #brew services list
            #cat /Users/vagrant/Library/LaunchAgents/homebrew.mxcl.postgresql.plist
            #cat /usr/local/var/log/postgres.log
            psql -d postgres -c "\du"
            psql -d postgres -U vagrant -h localhost -c "CREATE DATABASE yulife;"
            psql -d postgres -U vagrant -h localhost -c "CREATE USER yulife WITH PASSWORD 'yulife';"
            psql -d postgres -U vagrant -h localhost -c "ALTER USER yulife WITH SUPERUSER;"



            # Change node version to 10
            node -v

            brew uninstall --ignore-dependencies node@12 icu4c || true

            node -v | echo "Node not there"
            brew unlink node || true
            brew unlink node@12 || true
            brew install node@14 || true
            brew unlink node || true
            brew link --overwrite --force node@14

            node -v
    - script@1:
        title: Install & run MongoDB
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            mkdir ~/data
            brew tap --repair
            brew update
            brew tap mongodb/brew
            brew install mongodb-community@5.0
            brew tap homebrew/services
            echo "  port: 27018" >> /usr/local/etc/mongod.conf
            brew services start mongodb-community@5.0
            #brew services list
            cat /usr/local/etc/mongod.conf
            node -v
    - script@1:
        title: Pull & run API
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e

            CWD=$(pwd)

            mkdir ~/temp-repos
            cd ~/temp-repos

            git clone git@gitlab.com:yu-life/yulife-api-server.git
            cd yulife-api-server
            git checkout $BITRISE_GIT_BRANCH || git checkout develop
            git pull


            node -v
            yarn install --frozen-lockfile
            echo "Install completed"
            ./scripts/setupPostgresForBitrise.sh
            yarn build

            yarn detox:changeRegionDatabase:UK

            npm install -g forever modclean
            modclean -r # to mimic build containers
            NODE_ENV=detox DEBUG=yu:* forever start -o ./api-stdout.txt -e ./api-stderr.txt build/app/index.js
            sleep 30
            curl http://localhost:5000

            cd $CWD
