  ios-detox-build-70:
    before_run:
    - ios-git-checkout
    steps:
    - nvm@1: {}
    - script@1:
        title: Install dependencies & build binary
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e

            # Install node version
            brew uninstall --force yarn
            . $HOME/.nvm/nvm.sh
            nvm use
            npm i -g yarn
            corepack enable
            yarn install --immutable

            # Generate native projects
            yarn env:config:local && EXPO_NO_DOTENV=1 npx expo prebuild --platform=ios

            # Install ruby version
            cd ios
            asdf install ruby $(cat .ruby-version)
            asdf global ruby $(cat .ruby-version)
    - script:
        inputs:
        - content: |
            #!/bin/bash
            envman add --key NO_FLIPPER --value 1
    - cocoapods-install@2: {}
    - script@1:
        title: Build Detox
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            yarn detox:build -c ios.sim.release
    - save-cache@1:
        inputs:
        - paths: |-
            $BITRISE_SOURCE_DIR/ios
            $BITRISE_SOURCE_DIR/node_modules
            $BITRISE_SOURCE_DIR/src/locale/translations/downloaded
        - key: ios-detox-build-$BITRISE_GIT_BRANCH
    meta:
      bitrise.io:
        stack: osx-xcode-16.2.x
