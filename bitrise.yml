format_version: "3"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react_native
app:
  envs:
  - GRADLEW_PATH: android/gradlew
    opts:
      is_expand: false
  - GRADLE_BUILD_FILE_PATH: android/build.gradle
    opts:
      is_expand: false
  - GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
    opts:
      is_expand: false
  - BUNDLE_OUTPUT_FOLDER: release
    opts:
      is_expand: false
  - BITRISE_PROJECT_PATH: ios/YuLife.xcworkspace
    opts:
      is_expand: false
  - RELEASE_ENVIRONMENT: uat
  - XCODE_EXPORT_METHOD: development
  - APP_VERSION: 0.0.1
  - BUNDLE_ID: com.yulife.develop
  - BITRISE_SCHEME: YuLife
  - IPHONE_DEVICE: iPhone 11 Pro
    opts:
      is_expand: false
  - DETOX_TEST_TYPE: smoke
    opts:
      is_expand: false
  - DISPLAY_NAME: YuLife
    opts:
      is_expand: false
meta:
  bitrise.io:
    machine_type: performance
    stack: osx-xcode-13.0.x
trigger_map:
- push_branch: develop
  pipeline: pipeline-develop
- push_branch: task/devop-967
  pipeline: pipeline-develop
- push_branch: release/*
  pipeline: pipeline-release-uat
- push_branch: master
  workflow: android-UAT
- push_branch: release/**
  workflow: ios-detox-build-70
- push_branch: upgrade/*
  workflow: ios-develop-70
- tag: test-branch*
  pipeline: pipeline-test-branch
- tag: release*
  pipeline: pipeline-release-prod
- tag: android-release*
  workflow: android-production-62
pipelines:
  pipeline-develop:
    stages:
    - stage-develop: {}
  pipeline-release-prod:
    stages:
    - stage-release-prod: {}
  pipeline-release-uat:
    stages:
    - stage-release-uat: {}
  pipeline-test-branch:
    stages:
    - stage-test-branch: {}
stages:
  stage-develop:
    workflows:
    - ios-develop-70: {}
    - android-develop-62: {}
  stage-release-prod:
    workflows:
    - ios-production-62: {}
    - android-production-62: {}
    - ios-production-70: {}
  stage-release-uat:
    workflows:
    - ios-UAT-70: {}
    - android-UAT-62: {}
  stage-test-branch:
    workflows:
    - ios-develop-62: {}
    - android-develop-62: {}
    - ios-develop-70: {}
workflows:
  android-UAT:
    before_run:
    - android-primary
    envs:
    - RELEASE_ENVIRONMENT: uat
    - ENVFILE: .env.uat
    - BUNDLE_OUTPUT_FOLDER: uat
      opts:
        is_expand: false
    steps:
    - install-missing-android-tools: {}
    - gradle-runner:
        inputs:
        - gradle_file: $GRADLE_BUILD_FILE_PATH
        - gradle_task: assembleUat -PsplitApks
        - gradlew_path: $GRADLEW_PATH
    - sign-apk@1.2.0:
        inputs:
        - apk_path: $BITRISE_APK_PATH_LIST
    - script@1.1.5:
        title: Remove unsigned apks
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            find $BITRISE_DEPLOY_DIR -name '*-unsigned.apk' -type f -size -100M -delete
    - deploy-to-bitrise-io:
        inputs:
        - notify_email_list: test@yulife.com
        - public_install_page_url_map_format: '{{range $index, $element := .}}{{printf "%s|%s\n" $element.File $element.URL}}{{end}}'
        - notify_user_groups: admins, testers
    - slack@3.1.2:
        title: Build message
        is_always_run: false
        inputs:
        - channel: '#alerts-engineering'
        - from_username: UAT Build Succeeded
        - from_username_on_error: UAT Build Failed
        - emoji: ':android-icon:'
        - emoji_on_error: ':android-icon:'
        - icon_url: ""
        - pretext: Ready for regression test!
        - footer: yulife
        - footer_icon: https://join.yulife.com/static/favicon.png
        - fields: |
            Branch|${BITRISE_GIT_BRANCH}
            Workflow|${BITRISE_TRIGGERED_WORKFLOW_ID}
        - channel_on_error: '#engineering-alerts'
        - icon_url_on_error: ""
        - pretext_on_error: ""
        - buttons: |-
            View Build|${BITRISE_BUILD_URL}
            ${BITRISE_PUBLIC_INSTALL_PAGE_URL_MAP}
        - webhook_url: $SLACK_WEBHOOK_URL
    - script@1.1.4:
        title: Install CodePush CLI
        inputs:
        - content: |-
            #!/bin/bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # write your script here
            echo "Installing yarn"

            # or run a script from your repository, like:
            # bash ./path/to/script.sh
            # not just bash, e.g.:
            # ruby ./path/to/script.rb

            # install Yarn
            npm install -g code-push-cli
    - script@1.1.4:
        title: CodePush Auth
        inputs:
        - content: |-
            #!/bin/bash

            code-push login --accessKey $CODEPUSH_ACCESS_KEY
    - script@1.1.4:
