format_version: "3"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react_native
app:
  envs:
  - GRADLEW_PATH: android/gradlew
    opts:
      is_expand: false
  - GRADLE_BUILD_FILE_PATH: android/build.gradle
    opts:
      is_expand: false
  - GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"
    opts:
      is_expand: false
  - BUNDLE_OUTPUT_FOLDER: release
  - BUNDLE_OUTPUT_ASSETS_FOLDER: createBundleReleaseJsAndAssets
    opts:
      is_expand: false
  - BITRISE_PROJECT_PATH: ios/YuLife.xcworkspace
    opts:
      is_expand: false
  - XCODE_EXPORT_METHOD: development
  - APP_VERSION: 0.0.1
  - BUNDLE_ID: com.yulife.develop
  - BITRISE_SCHEME: YuLife
  - IPHONE_DEVICE: iPhone 15 Pro Max
    opts:
      is_expand: false
  - DETOX_TEST_TYPE: smoke
    opts:
      is_expand: false
  - DISPLAY_NAME: YuLife
    opts:
      is_expand: false
  - NODE_OPTIONS: --max-old-space-size=4096
  - SKIP_ASSERTIONS: ""
  - TARGET_LOCALE: en-GB
  - REPORT_S3_BUCKET_NAME: yu-eu-west-2-develop-detox-static-origin
    opts:
      is_expand: false
  - REPORT_DNS_NAME: detox.develop.uk.yulife.engineering
    opts:
      is_expand: false
meta:
  bitrise.io:
    machine_type: performance
    machine_type_id: g2-m1.4core
    stack: osx-xcode-16.2.x
trigger_map:
- pipeline: pipeline-release-uat
  push_branch: release/*
- workflow: ios-detox-build-70
  push_branch: release/**
- pipeline: pipeline-test-branch
  tag: test-branch*
- pipeline: pipeline-release-prod
  tag: release*
- workflow: android-production
  tag: android-release*
pipelines:
  pipeline-develop:
    stages:
    - stage-develop: {}
    - stage-bugsnag-build-reporter: {}
  pipeline-release-prod:
    stages:
    - stage-release-prod: {}
    - stage-bugsnag-build-reporter: {}
  pipeline-release-uat:
    stages:
    - stage-release-uat: {}
    - stage-bugsnag-build-reporter: {}
  pipeline-test-branch:
    stages:
    - stage-test-branch: {}
stages:
  stage-bugsnag-build-reporter:
    workflows:
    - bugsnag-build-reporter: {}
  stage-develop:
    workflows:
    - ios-develop: {}
    - android-develop: {}
  stage-release-prod:
    workflows:
    - android-production: {}
    - ios-production: {}
  stage-release-uat:
    workflows:
    - ios-UAT: {}
    - android-UAT: {}
  stage-test-branch:
    workflows:
    - android-develop: {}
    - ios-develop: {}
workflows:
  android-UAT:
    before_run:
    - android-primary
    after_run:
    - upload-bugsnag-mappings
    envs:
    - RELEASE_ENVIRONMENT: uat
    - ENVFILE: .env.uat
    - BUNDLE_OUTPUT_FOLDER: uat
    - BUNDLE_ID: com.yulife.release
    - BUNDLE_OUTPUT_ASSETS_FOLDER: createBundleUatJsAndAssets
      opts:
        is_expand: false
    steps:
    - set-java-version@1:
        inputs:
        - set_java_version: "17"
    - install-missing-android-tools: {}
    - gradle-runner@1:
        title: 'Gradle: clean'
        inputs:
        - gradle_task: clean
    - gradle-runner@3.0.0:
        title: 'Gradle: assembleRelease'
        inputs:
        - gradle_file: $GRADLE_BUILD_FILE_PATH
        - gradle_task: assembleRelease -PsplitApks
        - gradlew_path: $GRADLEW_PATH
    - sign-apk@1:
        inputs:
        - use_apk_signer: "true"
        - apk_path: $BITRISE_APK_PATH_LIST
    - script@1.2:
        title: Remove unsigned apks
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            find $BITRISE_DEPLOY_DIR -not -name '*-signed.apk' -type f -size -100M -delete
            cd $BITRISE_DEPLOY_DIR
            for f in *.apk; do mv "$f" "${f%.apk}-$BITRISE_BUILD_NUMBER.apk"; done
    - deploy-to-bitrise-io:
        inputs:
        - notify_email_list: test@yulife.com
        - public_install_page_url_map_format: '{{range $index, $element := .}}{{printf
            "%s|%s\n" $element.File $element.URL}}{{end}}'
        - notify_user_groups: admins, testers
    - slack@3.1.2:
        title: Build message
        is_always_run: false
        inputs:
        - channel: '#alerts-engineering'
        - from_username: UAT Build Succeeded
        - from_username_on_error: UAT Build Failed
        - emoji: ':android-icon:'
        - emoji_on_error: ':android-icon:'
        - icon_url: ""
        - pretext: Ready for regression test!
        - footer: yulife
        - footer_icon: https://join.yulife.com/static/favicon.png
        - fields: |
            Branch|${BITRISE_GIT_BRANCH}
            Workflow|${BITRISE_TRIGGERED_WORKFLOW_ID}
        - channel_on_error: '#engineering-alerts'
        - icon_url_on_error: ""
        - pretext_on_error: ""
        - buttons: |-
            View Build|${BITRISE_BUILD_URL}
            ${BITRISE_PUBLIC_INSTALL_PAGE_URL_MAP}
        - webhook_url: $SLACK_WEBHOOK_URL
    - script@1:
        title: Update Hackerone short.io links
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            node scripts/update-hackerone-android-asset.js
    - script@1.2:
        title: Set bugsnag build metadata
        inputs:
        - content: |-
            #!/usr/bin/env bash

            # set release version and environment and propagate env var to other stages
            PACKAGE_VERSION=$(cat package.json | jq -r '.version')
            PREFIX_VERSION="${PACKAGE_VERSION%.*}"
            envman add --key BUGSNAG_RELEASE_VERSION --value "${PREFIX_VERSION}.${BITRISE_BUILD_NUMBER}"
            envman add --key BUGSNAG_RELEASE_ENVIRONMENT --value "${RELEASE_ENVIRONMENT}"
    - share-pipeline-variable@1:
        inputs:
        - variables: |-
            BUGSNAG_RELEASE_VERSION
            BUGSNAG_RELEASE_ENVIRONMENT
  android-develop:
    before_run:
    - android-primary
    after_run:
    - upload-bugsnag-mappings
    envs:
    - RELEASE_ENVIRONMENT: develop
    - ENVFILE: .env.develop
    - DISPLAY_NAME: YuLife (develop)
    - BUNDLE_ID: com.yulife.release
    - BUNDLE_OUTPUT_FOLDER: release
    - BUNDLE_OUTPUT_ASSETS_FOLDER: createBundleReleaseJsAndAssets
