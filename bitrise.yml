  ios-detox-build-70:
    before_run:
    - ios-git-checkout
    steps:
    - nvm@1:
        inputs:
        - node_version: 16.19.0
        - nvm_version: 0.38.0
    - script@1:
        title: Install dependencies & build binary
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            npm install -g detox-cli
            brew uninstall --force yarn
            npm i -g yarn
            yarn
            # bundle install
            # cd ios && bundle exec pod install && cd ..
            # yarn detox:build -c ios.sim.release
    - cocoapods-install@2:
        inputs:
        - verbose: "true"
    - script@1:
        title: Build Detox
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            yarn detox:build -c ios.sim.release
    - cache-push@2:
        inputs:
        - is_debug_mode: "true"
        - cache_paths: |-
            $BITRISE_SOURCE_DIR/ios/build/Build/Products/Release-iphonesimulator/YuLife.app
            $BITRISE_SOURCE_DIR/node_modules
