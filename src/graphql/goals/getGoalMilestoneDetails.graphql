query GetGoalMilestoneDetails($goals: [GetGoalMilestoneDetailsInput]) {
  getGoalMilestoneDetails(goals: $goals) {
    list {
      rewardTitle
      progress
      target
      rewardQuantity
      image {
        ...RemoteImage
      }
      overlayImage {
        id
        uri
      }
      theme {
        primaryColor
        secondaryColor
        overlayColor
      }
    }
    hint {
      label
      description
      image {
        ...RemoteImage
      }
      onPress {
        type
        payload
      }
    }
  }
}
