query GetDailyScreenCustomIcon {
  getDailyScreenCustomIcon {
    name
    position
    y
    x
    image {
      width
      height
      source {
        uri(options: { width: 116, height: 112 })
      }
    }
    text {
      x
      y
      type
      value
      colour
    }
    onPress {
      payload
      type
    }
  }
}
