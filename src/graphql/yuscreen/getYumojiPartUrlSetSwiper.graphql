query GetYumojiPartUrlSetSwiper($partType: AvatarPartType) {
  getYumojiPartUrlSetSwiper(partType: $partType) {
    variants {
      coverType
      worlds {
        worldId
        remoteUrl {
          ...RemoteImage
        }
        title {
          label
          color
        }
      }
    }
  }
}
