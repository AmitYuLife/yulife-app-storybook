fragment SmokingSectionContent on SmokingSectionContent {
  title
  description
  onCardPress {
    ...SduiAction
  }
  buttonText
  onButtonPress {
    ...SduiAction
  }
  image {
    ...VariableRemoteImage
  }
  backgroundImage {
    ...RemoteImage
  }
}

fragment SmokingSection on SmokingSection {
  __typename
  id
  sectionInstanceId
  ready
  updateOnView
  loadingGroup
  content {
    ...SmokingSectionContent
  }
}
