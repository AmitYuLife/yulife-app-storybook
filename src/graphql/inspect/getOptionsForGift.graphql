query GetOptionsForGift {
  data: getOptionsForGift {
    id
    sendsRemainingToday
    yuCoinDenominations
    maxRecipientsPerGiftRequest
    maxDailySendsPerUser
    messagePresets {
      id
      label
    }
    backgrounds {
      ...GiftBackgroundAsset
    }
    stickers {
      ...GiftStickerAsset
    }
  }
}
