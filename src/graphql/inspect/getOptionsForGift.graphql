query GetOptionsForGift {
  data: getOptionsForGift {
    id
    sendsRemainingToday
    yuCoinDenominations
    maxRecipientsPerGiftRequest
    messagePresets {
      id
      label
    }
    backgrounds {
      id
      image {
        ...RemoteImage
      }
      textColor
    }
    stickers {
      id
      image {
        ...RemoteImage
      }
    }
  }
}
