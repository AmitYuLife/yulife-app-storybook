mutation SendGiftToRecipients(
  $yuCoinAmount: Int!
  $messagePresetId: String!
  $recipientIds: [ID!]!
  $deduplicationKey: String!
  $backgroundId: String
  $stickerId: String
) {
  sendGiftToRecipients(
    yuCoinAmount: $yuCoinAmount
    messagePresetId: $messagePresetId
    recipientIds: $recipientIds
    deduplicationKey: $deduplicationKey
    backgroundId: $backgroundId
    stickerId: $stickerId
  ) {
    success
    failed
  }
}
