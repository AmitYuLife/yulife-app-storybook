query GetMobilePurchasesList($filter: RewardListFilter, $limit: Int, $offset: Int) {
  data: getMobilePurchasesList(filter: $filter, limit: $limit, offset: $offset) {
    __typename
    id
    sduiStepId
    list {
      __typename
      id
      date
      title
      yuCoin
      status
      statusColour
    }
  }
}
