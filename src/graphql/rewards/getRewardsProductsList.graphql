query GetRewardsProductsList {
  getRewardsProductsList {
    id
    backgroundImage {
      id
      uri
    }
    yuCoinPowerIncrease
    title
    cta
    imageOverlay {
      text
      color
      styles {
        property
        value
      }
    }
    onPress {
      productAction {
        ...ProductAction
      }
      sduiAction {
        ...SduiAction
      }
    }
    event {
      type
      payload
    }
  }
}
