query GetMobileGameBattlePassFull($socialGroupId: String) {
  battlePass: getMobileGameBattlePass {
    ...MobileGameBattlePass
  }
  templates: getMobileBattlePassDonationTemplates(socialGroupId: $socialGroupId) {
    ...MobileBattlePassDonationTemplate
  }
  contentLocation: getMobileUserContentLocation {
    hasUserSelectedContentLocation
    location
    locationLabel
  }
}
