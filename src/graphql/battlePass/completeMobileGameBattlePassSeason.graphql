mutation CompleteMobileGameBattlePassSeason($goalId: String!, $startNew: Boolean) {
  completeMobileGameBattlePassSeason(goalId: $goalId, startNew: $startNew) {
    id
    title
    description
    backgroundImage {
      ...RemoteImage
    }
    progressStatus {
      ...MobileGameBattlePassProgressInfo
    }
    rewards {
      ...MobileGameBattlePassReward
    }
  }
}
