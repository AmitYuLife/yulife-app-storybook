fragment HealthSmokingState on HealthSmokingState {
  heading
  headerButtonText
  streakCarousel {
    id
    position
    status
    title
    titleColour
    backgroundColour
    icon {
      ...RemoteImage
    }
    overlayIcon {
      ...RemoteImage
    }
    buttonLabel
    onPress {
      ...SduiAction
    }
  }
  streakPastMax
  currentStreak
  journeySoFarHeading
  milestoneCarousel {
    id
    title
    completed
  }
  totalAvoided {
    image {
      ...RemoteImage
    }
    title
    value
  }
  totalSaved {
    image {
      ...RemoteImage
    }
    title
    value
  }
  triggers
  reasons
  showStreakCheckInOverlay
  streakCheckInOverlay {
    title
    failCta
    continueCta
    celebration {
      title
      description
      cta
    }
    showMilestoneUnlocked
    milestoneUnlocked {
      title
      image {
        ...RemoteImage
      }
      statistics
      infoBox {
        title
        description
      }
      days
      cta
    }
  }
  optOutText
  optOutModal {
    image {
      ...RemoteImage
    }
    title
    description
    buttonText
    buttonAction {
      ...SduiAction
    }
    backButtonText
  }
  isActive
  updatedToday
}
