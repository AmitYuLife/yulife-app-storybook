fragment WellbeingHubSectionContent on WellbeingHubSectionContent {
  items {
    id
    image {
      ...RemoteImage
    }
    title
    description
    route
    pillText
  }
  buttonLabel
}

fragment WellbeingHubSection on WellbeingHubSection {
  __typename
  id
  sectionInstanceId
  ready
  updateOnView
  loadingGroup
  content {
    ...WellbeingHubSectionContent
  }
  onScrollIntoView {
    ...SduiAction
  }
}
