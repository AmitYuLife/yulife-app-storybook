query GetActiveBuffsOverlay($buffTypes: [BuffArea!]!) {
  getActiveBuffsOverlay(buffTypes: $buffTypes) {
    icon {
      ...RemoteImage
    }
    image {
      ...RemoteImage
    }
    title
    equipment {
      slotUri
      iconUri
      buffs {
        icon {
          ...RemoteImage
        }
        title
        description
      }
    }
  }
}
