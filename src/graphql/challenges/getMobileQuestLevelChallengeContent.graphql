query GetMobileQuestLevelChallengeContent(
  $level: Int!
  $yuniversalMap: Int
  $levelSlotTemplateId: String!
  $contentTags: [String!]!
) {
  getMobileQuestLevelChallengeContent(
    level: $level
    yuniversalMap: $yuniversalMap
    levelSlotTemplateId: $levelSlotTemplateId
    contentTags: $contentTags
  ) {
    media {
      ...Media
    }
    reward
    stars
    formattedDuration
  }
}
