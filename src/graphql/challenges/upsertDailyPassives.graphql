mutation UpsertDailyPassives($payload: [ChallengesPayload!]!, $sessionId: String, $hasLastItem: Boolean) {
  upsertDailyPassives(payload: $payload, sessionId: $sessionId, hasLastItem: $hasLastItem) {
    challenges {
      updatedAt
      yuCoinAwarded
      incomingData {
        steps
        meditation
        distance
      }
    }
    totalCoins
    currentBalance
  }
}
