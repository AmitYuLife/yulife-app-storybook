fragment User on User {
  __typename
  id
  archived
  firstName
  lastName
  fullName
  createdAt
  redeemedOnboarding
  challengesDoneToday
  userFeatures {
    name
    value
  }
  passiveSteps: passiveChallenge {
    exchange {
      yucoin
      steps
      meditation
      surge
    }
    levelSlot {
      id
      milestones {
        id
        coins
      }
    }
  }
  supportConfig {
    supportLevel
  }
}
