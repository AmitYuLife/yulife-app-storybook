    primaryColor
  }
  button {
    ...ContentItemButton
  }
  close {
    icon {
      ...RemoteImage
    }
    onPress {
      ...SduiAction
    }
  }
  items {
    id
    heading
    paragraph
    title
    backgroundImage {
      ...RemoteImage
    }
    styles {
      ...SduiStyle
    }
  }
}
