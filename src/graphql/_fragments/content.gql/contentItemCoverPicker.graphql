fragment ContentItemCoverPicker on ContentItemCoverPicker {
  id
  answerKey
  answerKeyDefaultValue
  hasSelectedCustomCover
  styles {
    ...SduiStyle
  }
  options {
    value
    coverType
    subheading
    heading
  }
  coverPickerTitle: title {
    ...ContentItemText
  }
  customCover {
    title
    button {
      ...ContentItemButton
    }
    itemsPicker {
      ...ContentItemScrollableItemsPicker
    }
  }
}
