fragment ContentItemChoice on ContentItemChoice {
  id
  answerKey
  labelTextType
  choiceOptions: options {
    value
    label
  }
  multiSelect
  alignTop
  otherOption {
    value
    label
    maxLength
  }
  design
  rowStyles {
    ...SduiStyle
  }
  styles {
    ...SduiStyle
  }
  textStyles {
    ...SduiStyle
  }
  selectedStyles {
    ...SduiStyle
  }
}
