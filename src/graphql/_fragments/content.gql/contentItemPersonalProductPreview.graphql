fragment ContentItemPersonalProductPreview on ContentItemPersonalProductPreview {
  id
  answerKey
  answerKeyDefaultValue
  documentHyperlink: hyperlink {
    title
    leftIcon {
      ...RemoteImage
    }
    onPress {
      ...SduiAction
    }
  }
  styles {
    ...SduiStyle
  }
  coverList {
    ...ContentItemCoverListItem
  }
  coverExpirationDate
  showYumoji
  percentageBox {
    selectedValue
    selectedCoverType
    primaryColour
    secondaryColour
  }
}
