fragment MobileBattlePassDonationTemplate on MobileBattlePassDonationTemplate {
  id
  title
  description
  yuCoin
  sortOrder
  availableDates
  rewardId
  leaderboards {
    socialGroupId
    leaderboardId
  }
  image {
    ...RemoteImage
  }
  leaderboard {
    id
    items {
      ...SocialGroupLeaderboardItem
    }
  }
  endOfSeasonInfo {
    title
    score
    icon {
      ...RemoteImage
    }
  }
}
