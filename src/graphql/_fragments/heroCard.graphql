fragment HeroCard on HeroCard {
  id
  badge {
    text
    icon
  }
  theme {
    backgroundColor
    borderColor
    fontColor
    boldTextColor
  }
  header {
    heading
    image {
      ...RemoteImage
    }
    subheadingMargin
    subheading {
      text
      icon
    }
    button {
      text
      icon
      state
    }
  }
  body {
    progress {
      currentProgress
      maxProgress
      milestones {
        progress
        state
      }
    }
    scaleRightImage
    rightImage {
      ...VariableRemoteImage
    }
    backgroundImage {
      ...RemoteImage
    }
  }
  footer {
    left {
      text
      icon
    }
    right {
      text
      icon
    }
  }
  onPress {
    ...SduiAction
  }
  activePeriod {
    startDate
    endDate
  }
}
