query GetTournamentTeamLeaderboard($eventId: ID!, $limit: Int, $offset: Int) {
  getTournamentTeamLeaderboard(eventId: $eventId, limit: $limit, offset: $offset) {
    teamName
    totalScore
    averageScore
    membersCount
    members {
      id
      name
      score
      image {
        id
        uri
      }
    }
  }
}
