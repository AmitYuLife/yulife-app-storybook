query GetEmploymentTheme($businessAccountId: String!) {
  getMobileGameThemeForEmployment(businessAccountId: $businessAccountId) {
    ...MobileGameTheme
    sections {
      wellbeing {
        headerTextColor
        heroImageBackground {
          ...RemoteImage
        }
        heroImageIcon {
          ...RemoteImage
        }
        logoType
      }
    }
  }
}
