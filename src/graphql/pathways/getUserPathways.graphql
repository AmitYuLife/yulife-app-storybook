query GetUserPathways($startDate: String, $endDate: String) {
  getUserPathways {
    ...UserPathways
  }
  getUserMoodSubmissions(startDate: $startDate, endDate: $endDate) {
    ...UserMoodSubmissionsResponse
  }
  getUserPathwayAdviceSection {
    items {
      ...UserPathwayAdviceItem
    }
  }
  getInterventionItems {
    id
    sections {
      ...YuScreenSection
    }
  }
}
