def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: "com.android.application"

project.ext.envConfigFiles = [
        debug     : ".env",
        local     : ".env.local",
        uat       : ".env.uat",
        production: ".env.production"
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

import com.android.build.OutputFile

project.ext.react = [
        entryFile: "index.js"
]

apply from: "../../node_modules/react-native/react.gradle"

def enableSeparateBuildPerCPUArchitecture = false

def enableProguardInReleaseBuilds = false

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.yulife"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        multiDexEnabled true
        missingDimensionStrategy "RNN.reactNativeVersion", "reactNative56"
        multiDexEnabled true
        renderscriptTargetApi rootProject.ext.minSdkVersion
        renderscriptSupportModeEnabled true
        resValue "string", "build_config_package", "com.yulife"
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "x86"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false  // If true, also generate a universal APK
            include "armeabi-v7a", "x86"
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            matchingFallbacks = ['debug']
        }
        local {
            initWith debug
        }
        uat {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            applicationIdSuffix ".uat"
            matchingFallbacks = ['release']
        }
        production {
            initWith uat
            applicationIdSuffix ".app"
            matchingFallbacks = ['release']
        }
    }
    // applicationVariants are e.g. debug, release
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            // For each separate APK per architecture, set a unique version code as described here:
            // http://tools.android.com/tech-docs/new-build-system/user-guide/apk-splits
            def versionCodes = ["armeabi-v7a": 1, "x86": 2]
            def abi = output.getFilter(OutputFile.ABI)
            if (abi != null) {  // null for the universal-debug, universal-release variants
                output.versionCodeOverride =
                        versionCodes.get(abi) * 1048576 + defaultConfig.versionCode
            }
        }
    }
}

dependencies {
    def googlePlayServicesVersion = safeExtGet("googlePlayServicesVersion", "+")
    def androidAppCompatVersion = safeExtGet("androidAppCompatVersion", "+")
    def reactNativeVersion = safeExtGet("reactNativeVersion", "+")

    implementation project(':react-native-blur')
    implementation project(':react-native-config')
    implementation project(':react-native-navigation')
    implementation project(':react-native-svg')
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.android.support:appcompat-v7:$androidAppCompatVersion"
    implementation "com.facebook.react:react-native:$reactNativeVersion"

    // Intercom
    implementation project(':react-native-intercom')
    implementation "io.intercom.android:intercom-sdk:5.+"

    // Mixpanel
    implementation project(':react-native-mixpanel')
    implementation "com.mixpanel.android:mixpanel-android:5.+"
    implementation "com.google.android.gms:play-services-gcm:$googlePlayServicesVersion"

    // Bugsnag
    implementation project(':bugsnag-react-native')

    // Dual Pedometer
    implementation project(':react-native-dual-pedometer')

    // FitKit
    implementation project(':react-native-fitkit')
}

// Run this once to be able to run the application with BUCK
// puts all compile dependencies into folder libs for BUCK to use
task copyDownloadableDepsToLibs(type: Copy) {
    from configurations.compile
    into 'libs'
}
