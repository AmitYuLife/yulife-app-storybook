def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: "com.android.application"

project.ext.envConfigFiles = [
        debug     : ".env",
        local     : ".env.local",
        uat       : ".env.uat",
        production: ".env.production"
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

import com.android.build.OutputFile

project.ext.react = [
        entryFile: "index.android.js",
        bundleInRelease: true,
        bundleInUat: true,
        bundleInProduction: true,
        devDisabledInRelease: true,
        devDisabledInUat: true,
        devDisabledInProduction: true,
]

apply from: "../../node_modules/react-native/react.gradle"

def enableSeparateBuildPerCPUArchitecture = false

def enableProguardInReleaseBuilds = false

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.yulife"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        missingDimensionStrategy "RNN.reactNativeVersion", "reactNative57_5"
        multiDexEnabled true
        renderscriptTargetApi rootProject.ext.minSdkVersion
        renderscriptSupportModeEnabled true
        resValue "string", "build_config_package", "com.yulife"
        versionCode getNPMVersionCode()
        versionName getNPMVersionName()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    splits {
        abi {
            reset()
            enable project.hasProperty('splitApks')
            universalApk false  // If true, also generate a universal APK
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [deepLinkHost: "join-develop.yulife.com", deepLinkAppName:"yulife-debug"]
            applicationIdSuffix ".debug"
            debuggable true
            matchingFallbacks = ['debug']
        }
        local {
            initWith debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            applicationIdSuffix  ".release"
            matchingFallbacks = ['release']
            manifestPlaceholders = [deepLinkHost: "join-develop.yulife.com", deepLinkAppName:"yulife-develop"]
        }
        uat {
            initWith release
            applicationIdSuffix ".release"
            matchingFallbacks = ['release']
            manifestPlaceholders = [deepLinkHost: "join-uat.yulife.com", deepLinkAppName:"yulife-uat"]
        }
        production {
            initWith uat
            applicationIdSuffix ".app"
            matchingFallbacks = ['release']
            manifestPlaceholders = [deepLinkHost: "join.yulife.com", deepLinkAppName:"yulife"]
        }
    }
    // applicationVariants are e.g. debug, release
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            // For each separate APK per architecture, set a unique version code as described here:
            // http://tools.android.com/tech-docs/new-build-system/user-guide/apk-splits
            def versionCodes = ["armeabi-v7a":1, "x86":2, "arm64-v8a": 3, "x86_64": 4]
            def abi = output.getFilter(OutputFile.ABI)
            if (abi != null) {  // null for the universal-debug, universal-release variants
                output.versionCodeOverride =
                        versionCodes.get(abi) * 1048576 + defaultConfig.versionCode
            }
        }
    }
}

dependencies {
    implementation project(':@wootric_react-native-wootric')
    def reactNativeVersion = safeExtGet("reactNativeVersion", "+")

    implementation project(':react-native-device-info')
    implementation project(':react-native-push-notification')
    implementation project(':react-native-blur')
    implementation project(':react-native-config')
    implementation project(':react-native-navigation')
    implementation project(':react-native-svg')
    implementation project(':react-native-spring-scrollview')
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.android.support:appcompat-v7:$supportLibVersion"
    implementation "com.facebook.react:react-native:$reactNativeVersion"

    // Intercom
    implementation project(':react-native-intercom')
    implementation 'io.intercom.android:intercom-sdk-fcm:5.+'
    implementation "com.google.firebase:firebase-messaging:$firebaseVersion"

    // Mixpanel
    implementation project(':react-native-mixpanel')
    implementation "com.mixpanel.android:mixpanel-android:5.6.8"

    // Bugsnag
    implementation project(':bugsnag-react-native')

    // FitKit
    implementation project(':react-native-fitkit')

    // FastImage
    implementation("com.android.support:support-v4:$supportLibVersion")
    implementation project(':react-native-fast-image')
}

// Run this once to be able to run the application with BUCK
// puts all compile dependencies into folder libs for BUCK to use
task copyDownloadableDepsToLibs(type: Copy) {
    from configurations.compile
    into 'libs'
}

apply plugin: 'com.google.gms.google-services'
