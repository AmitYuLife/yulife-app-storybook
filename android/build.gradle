// Top-level build file where you can add configuration options common to all sub-projects/modules.
import groovy.json.JsonSlurper;

buildscript {
    ext {
        kotlin_version = "1.9.21"
        kotlinCoroutineVersion = "1.7.0"
        RNNKotlinCoroutinesCore = kotlinCoroutineVersion
        RNNKotlinVersion = kotlin_version
        buildToolsVersion = '34.0.0'
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        kotlinVersion = kotlin_version
        frescoVersion = "2.5.0"
        ndkVersion = "25.1.8937393"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Version is auto added by react-native-gradle-plugin
        classpath('com.android.tools.build:gradle')
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$RNNKotlinVersion"
        classpath('com.facebook.react:react-native-gradle-plugin')

        classpath 'com.google.gms:google-services:4.3.3'
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))

        }

        google()
        mavenCentral {
            content {
                excludeGroup "com.facebook.react"
            }
        }
        maven { url 'https://www.jitpack.io' }
    }
}

def getNPMVersionName() {
    def inputFile = new File("$rootDir/../package.json")
    def packageJson = new JsonSlurper().parseText(inputFile.text)
    return packageJson["version"]
}

def getNPMVersionCode() {
    def inputFile = new File("$rootDir/../package.json")
    def packageJson = new JsonSlurper().parseText(inputFile.text)
    return packageJson["versionCode"]
}

def getRNVersion() {
    def inputFile = new File("$rootDir/../package.json")
    def packageJson = new JsonSlurper().parseText(inputFile.text)
    return packageJson["dependencies"]["react-native"]
}