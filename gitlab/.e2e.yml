include:
  - component: $CI_SERVER_FQDN/yu-life/infrastructure/yulife-devops-shared-config/assume-aws-role-with-web-identity@assume-aws-role-with-web-identity-2.0.0
    inputs:
      job_name: assume-aws-role-with-web-identity:qa-reporter
      role_arn: $QA_REPORTER_ROLE_ARN

.detox-cache:
  cache: &detox-cache
    policy: pull-push
    key: ios-detox-build
    paths:
      - .yarn
      - .cocoapods_cache
      - ios/build/Build/Products

ios-detox-build-app:
  tags:
    - oakhost_macos_m4
  image: $DEVOPS_AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/yulife-macos-xcode:1.0.0
  stage: build
  interruptible: true
  cache:
    <<: *detox-cache
  variables:
    FORCE_COLOR: 1
    GITLAB_TOKEN: $CI_JOB_TOKEN
    # Configure tart
    TART_EXECUTOR_SHELL: bash -l
    # Set cocoapods cache path to local folder to allow gitlab cache it
    CP_HOME_DIR: "$CI_PROJECT_DIR/.cocoapods_cache"
    BUNDLE_ID: "com.yulife.develop"
    XCODE_WORKSPACE: "YuLife.xcworkspace"
    XCODE_SCHEME: "YuLife"
    DISPLAY_NAME: "YuLife (e2e)"
    ENVFILE: ".env.e2e"
    # This will be the app version (patch)
    BITRISE_BUILD_NUMBER: 1234
    PLATFORM: ios
    ENABLE_YUWATCH: 0
    DETOX_BUILD_CONFIG: ios.sim.release
    FORCE_DETOX_BUILD: "1"
  script:
    - ./scripts/gitlab/detox/install_dependencies.sh
    - ./scripts/gitlab/detox/build_detox_app.sh
  artifacts:
    paths:
      - detox-build.log
    expire_in: 7 days
    untracked: false
  # TODO: Use proper rules once CI test jobs are ready
  rules:
    - when: never

.base-detox-test:
  extends: .assume-aws-role-with-web-identity:qa-reporter
  needs:
    - ios-detox-build-app
  tags:
    - oakhost_macos_m4
  image: $DEVOPS_AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/yulife-macos-xcode:1.0.0
  stage: test
  interruptible: true
  cache:
    <<: *detox-cache
    policy: pull
  variables:
    FORCE_COLOR: 1
    GITLAB_TOKEN: $CI_JOB_TOKEN
    # Configure tart
    TART_EXECUTOR_SHELL: bash -l
    # Build env vars
    CP_HOME_DIR: "$CI_PROJECT_DIR/.cocoapods_cache"
    BUNDLE_ID: "com.yulife.develop"
    XCODE_WORKSPACE: "YuLife.xcworkspace"
    XCODE_SCHEME: "YuLife"
    DISPLAY_NAME: "YuLife (e2e)"
    ENVFILE: ".env.e2e"
    # This will be the app version (patch)
    BITRISE_BUILD_NUMBER: 1234
    PLATFORM: ios
    ENABLE_YUWATCH: 0
    DETOX_BUILD_CONFIG: ios.sim.release
    # Detox env vars
    API_REGION: UK
    TARGET_LOCALE: en-GB
    IPHONE_DEVICE: iPhone 16 Pro
    REPORT_S3_BUCKET_NAME: yu-qa-production-reports
    REPORT_DNS_NAME: reports.qa.yulife.engineering
  script:
    - ./scripts/gitlab/detox/install_dependencies.sh
    # Build app if is not in cache
    - ./scripts/gitlab/detox/build_detox_app.sh
    # Run API server
    - ./scripts/gitlab/detox/pull_run_api_server.sh
    # Sync allure history
    - ./scripts/gitlab/detox/pull_latest_allure_report.sh
    # Run detox
    - ./scripts/gitlab/detox/run_detox_test.sh
    # Report results
    - ./scripts/gitlab/detox/upload_detox_report.sh
  artifacts:
    paths:
      - e2e-report
    expire_in: 7 days
    untracked: false

ios-detox-healthcheck-test:
  extends: .base-detox-test
  variables:
    DETOX_TEST_TYPE: healthcheck
  # TODO: Modify rules once CI test jobs are ready
  rules:
    - when: never
