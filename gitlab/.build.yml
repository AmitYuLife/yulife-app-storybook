build:e2e:
  extends: .base-node-18
  image: node:18.19.0-alpine
  stage: build
  interruptible: true
  script:
    - export GITLAB_TOKEN="${CI_JOB_TOKEN}"
    - yarn install --frozen-lockfile --cache-folder .yarn/
    - yarn e2e:build
    # Rebuild cache if needed
    - !reference [.build_cache, script]
  only:
    refs:
      - merge_requests
    changes:
      - e2e/**/*
