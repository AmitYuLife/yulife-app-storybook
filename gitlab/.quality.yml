sonarcloud-check:
  tags:
    - linux_amd64
  # Cancel job if newer commit made
  interruptible: true
  image:
    name: sonarsource/sonar-scanner-cli:5.0.1
    entrypoint: [""]
  stage: quality
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - git fetch --all
    - export PACKAGE_VERSION=$(node -p -e "require('./package.json').version")
    - echo -e "\nsonar.projectVersion=${PACKAGE_VERSION}" >> sonar-project.properties
    - cat sonar-project.properties
    - sonar-scanner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/

lint-bitrise:
  tags:
    # Bitrise CLI doesn't build binary for arm64
    - linux_amd64
  stage: quality
  image: golang:1.17
  script:
    # Install dependencies
    - apt-get update && apt-get install -y git jq rsync
    - echo "Installing Bitrise CLI..."
    - curl -sL https://github.com/bitrise-io/bitrise/releases/latest/download/bitrise-$(uname -s)-$(uname -m) -o /usr/local/bin/bitrise
    - chmod +x /usr/local/bin/bitrise
    - echo "Installing Offline Workflow Editor..."
    - bitrise setup
    # Format bitrise using workflow editor
    - ./scripts/format-bitrise.sh
    # Fail the job if there are changes
    - git diff --exit-code bitrise.yml || (echo "Changes detected in bitrise.yml, failing the job." && false)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bitrise.yml
