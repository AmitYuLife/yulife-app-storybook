include:
  - component: $CI_SERVER_FQDN/yu-life/infrastructure/yulife-devops-shared-config/mr-title-check@mr-title-check-1
  - component: $CI_SERVER_FQDN/yu-life/infrastructure/yulife-devops-shared-config/mr-description-check@mr-description-check-1
    inputs:
      minimum_length: 20
  - component: $CI_SERVER_FQDN/yu-life/infrastructure/yulife-devops-shared-config/pnpm-peer-deps-check@pnpm-peer-deps-check-1
    inputs:
      extends:
        - .cache-pull

tsc-check:
  extends:
    - .generic-node-arm64
    - .cache-pull
  stage: quality
  script:
    # Install node
    - nvm install -b
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm tsc
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
    - if: $CI_COMMIT_TAG =~ /^release\/.*$/
