release-develop-to-uat:
  extends: .generic-node-arm64
  stage: release
  when: manual
  script:
    # Install node
    - nvm install -b
    - BRANCH_VERSION_MAJOR=$(node -p -e "require('./package.json').version.split('.')[0]")
    - BRANCH_VERSION_MINOR=$(node -p -e "require('./package.json').version.split('.')[1]")
    - BRANCH_VERSION=${BRANCH_VERSION_MAJOR}.${BRANCH_VERSION_MINOR}
    # Switch from Gitlab SSH to Service User Basic Auth
    - git remote rm origin && git remote add origin https://oauth2:${GITLAB_TOKEN_RELEASE}@gitlab.com/$CI_PROJECT_PATH.git
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git config --global user.name "$GITLAB_USER_NAME"
    - git fetch -q
    # Update changelog
    - git checkout develop
    - node ./scripts/gitlab/update-changelog.js
    - npx prettier CHANGELOG.md --write
    - git add CHANGELOG.md
    # Hack since colon in commit message and environment variable not possible
    - 'echo "Release: updated changelog for " > tmp.message'
    - git commit --no-verify -m "$(cat tmp.message)${BRANCH_VERSION}.0"
    # Create release branch
    - git checkout -b "release/$BRANCH_VERSION"
    - git push -u origin "release/$BRANCH_VERSION" --no-verify
    # Update package version on develop
    - git checkout develop
    - "npm version minor --commit-hooks false -m 'Release: bump version to %s'"
    - git push --no-verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"

# This creates a tag for the release branch which triggers the prod pipeline
release-production-build:
  extends: .generic-node-arm64
  stage: release
  script:
    # Install node
    - nvm install -b
    # Switch from Gitlab SSH to Service User Basic Auth
    - git remote rm origin && git remote add origin https://oauth2:${GITLAB_TOKEN_RELEASE}@gitlab.com/$CI_PROJECT_PATH.git
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git config --global user.name "$GITLAB_USER_NAME"
    - git fetch --tags -q
    # Script runs on the develop branch, which is one version ahead of the release branch
    - git checkout develop
    # That's why the minor version is decremented by 1
    # When minor is 0 (major version bump), find the latest release branch from previous major
    - BRANCH_VERSION_MAJOR=$(node -p -e "require('./package.json').version.split('.')[0]")
    - BRANCH_VERSION_MINOR=$(node -p -e "require('./package.json').version.split('.')[1]")
    - |
      if [ "$BRANCH_VERSION_MINOR" -eq 0 ]; then
        PREV_MAJOR=$((BRANCH_VERSION_MAJOR - 1))
        BRANCH_VERSION=$(git branch -r --list "origin/release/${PREV_MAJOR}.*" --sort=-version:refname | head -n 1 | sed 's|origin/||' | xargs)
      else
        BRANCH_VERSION=${BRANCH_VERSION_MAJOR}.$((BRANCH_VERSION_MINOR - 1))
      fi
    - git checkout release/${BRANCH_VERSION}
    - |
      LATEST_TAG=$(git tag -l "release/$BRANCH_VERSION*" | sort -V | tail -n 1)

      if [ -z "$LATEST_TAG" ]; then
          # If there's no existing tag with the branch version, we create a new one with .0 suffix
          NEW_TAG="release/$BRANCH_VERSION.0"
      else
          # If there's already a tag, increment the patch version
          PATCH_VERSION=$((`echo $LATEST_TAG | cut -d . -f 3` + 1))
          NEW_TAG="release/$BRANCH_VERSION.$PATCH_VERSION"
      fi
      git tag $NEW_TAG
      git push origin $NEW_TAG
      echo "New release tag: ${NEW_TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "release-production-build"

release-production-ios-internal:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/ruby:3.2
  stage: release
  script:
    - ruby -v
    - gem install fastlane
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - fastlane ios submit_to_internal
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "release-production-ios-internal"

