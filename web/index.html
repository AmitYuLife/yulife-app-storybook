<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>YuLife</title>
    <style>
      @font-face {
        font-family: "Bariol-Regular";
        src: url("/assets/fonts/Bariol-Regular.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "Bariol-Bold";
        src: url("/assets/fonts/Bariol-Bold.otf") format("opentype");
        font-weight: bold;
        font-style: normal;
      }
      @font-face {
        font-family: "Bariol-Light";
        src: url("/assets/fonts/Bariol-Light.otf") format("opentype");
        font-weight: 300;
        font-style: normal;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: "Bariol-Regular", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Lock the app to a fixed iPhone-ish viewport regardless of browser size.
         Matches the playwright vibe config (414×896) so layout is identical
         under tests and during interactive vibe coding. */
      #root {
        width: 414px;
        height: 896px;
        max-width: 100vw;
        max-height: 100vh;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        position: relative;
      }

      /* Hide scrollbars but allow scrolling */
      ::-webkit-scrollbar {
        display: none;
      }

      textarea {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
